# Publishes magnetbear.gg. Every push to main goes live, so only push main with Silver's OK.
# While the site is under construction this uploads splash/ as-is (no build step).
# When the new site launches, this job builds it and uploads its output folder instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: splash
      - id: deployment
        uses: actions/deploy-pages@v5
